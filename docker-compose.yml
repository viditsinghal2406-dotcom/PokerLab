services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/pokerlab.db
    ports:
      - "8001:8000"
    volumes:
      - pokerlab-data:/data
      - pokerlab-exports:/exports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8001/api/v1
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  pokerlab-data:
  pokerlab-exports:
