<header><h1 id="lg" style="cursor:pointer">PokerLab</h1><nav id="nv"></nav><span id="wl" class="m"></span></header>
<main id="app"></main><div id="ts" class="toast" hidden></div>
<script>
const $=s=>document.querySelector(s),RK='23456789TJQKA',SU='♠♥♦♣',C=['#2f8f63','#d23a32','#e0b341','#6aa6e8','#b58be8'];
const sum=a=>a.reduce((x,y)=>x+y,0),mean=a=>sum(a)/a.length,sd=a=>{const m=mean(a);return Math.sqrt(sum(a.map(x=>(x-m)**2))/Math.max(1,a.length-1))};
const rngf=s=>{let a=s>>>0;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}};
const CC={},ci=(n,k)=>CC[n+','+k]||(CC[n+','+k]=(()=>{const o=[];(function f(s,c){if(c.length==k)return o.push(c);for(let i=s;i<n;i++)f(i+1,[...c,i])})(0,[]);return o})());
function ev5(c){const r=c.map(x=>x>>2).sort((a,b)=>b-a),fl=c.every(x=>(x&3)==(c[0]&3));let st=0;if(new Set(r).size==5){if(r[0]-r[4]==4)st=r[0]+1;else if(r[0]==12&&r[1]==3)st=4}
const m={};r.forEach(x=>m[x]=(m[x]||0)+1);const g=Object.entries(m).map(([k,v])=>[v,+k]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]),sh=g.map(x=>x[0]).join(''),k=st?[st]:g.map(x=>x[1]);
const cat=st&&fl?8:sh=='41'?7:sh=='32'?6:fl?5:st?4:sh=='311'?3:sh=='221'?2:sh=='2111'?1:0;return cat*1e6+k.reduce((a,x)=>a*14+x,0)}
const VAR={holdem:{n:2},omaha:{n:4,om:1,pl:1},omaha5:{n:5,om:1,pl:1},pine:{n:3,disc:1}},VARN={holdem:'Texas Hold’em',omaha:'Pot-Limit Omaha',omaha5:'5-Card Omaha (PL)',pine:'Crazy Pineapple'};
const best=(V,h,b)=>{let m=0;if(V.om){for(const x of ci(h.length,2))for(const y of ci(b.length,3))m=Math.max(m,ev5([h[x[0]],h[x[1]],b[y[0]],b[y[1]],b[y[2]]]))}else{const a=h.concat(b);for(const x of ci(a.length,5))m=Math.max(m,ev5(x.map(i=>a[i])))}return m};
function equity(V,h,b,rng,n=12){const u=new Set(h.concat(b)),d=[];for(let i=0;i<52;i++)if(!u.has(i))d.push(i);const k=h.length+5-b.length;let w=0;for(let t=0;t<n;t++){for(let i=0;i<k;i++){const j=i+Math.floor(rng()*(d.length-i));[d[i],d[j]]=[d[j],d[i]]}const bd=b.concat(d.slice(h.length,k)),x=best(V,h,bd),y=best(V,d.slice(0,h.length),bd);w+=x>y?1:x==y?.5:0}return w/n}
const POL={vidit:{n:'Vidit Mode',agg:.85,bluff:.3,risk:.85},aggro:{n:'Aggressive',agg:.9,bluff:.15,risk:.5},bal:{n:'Balanced',agg:.5,bluff:.1,risk:.4},cons:{n:'Conservative',agg:.2,bluff:.02,risk:.15},rand:{n:'Random',r:1}},PN=Object.fromEntries(Object.entries(POL).map(([k,v])=>[k,v.n]));
// Policies see only own hole cards, board, pot, legal bounds (never opponent cards).
function bot(P,s,rng){const{tc,T,lo,hi,canR,ob}=s;
if(P.r){const x=rng();if(tc>0)return x<.25?{t:'f'}:x<.8||!canR?{t:'c'}:{t:'r',to:lo};return x<.6||!canR?{t:'c'}:{t:'r',to:lo+rng()*(hi-lo)}}
const eq=equity(s.V,s.h,s.b,rng),po=tc/(T+tc),bl=eq<.4&&rng()<P.bluff,sz=.35+P.risk*(.3+rng()*.7);let to=Math.min(hi,Math.max(lo,ob+sz*(T+tc)));if(rng()<P.risk*.08&&(eq>.6||bl))to=hi;
if(canR&&(eq>.72-.17*P.agg||bl))return{t:'r',to,bl};if(tc==0)return eq>.58-.15*P.agg&&canR?{t:'r',to}:{t:'c'};return eq+.1*P.risk>=po+.03?{t:'c'}:{t:'f'}}
async function hand(cfg,rng,P,ui){const V=VAR[cfg.v],S=100,deck=[...Array(52).keys()];for(let i=51;i>0;i--){const j=Math.floor(rng()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
const G={hole:[deck.splice(0,V.n),deck.splice(0,V.n)],board:[],stk:[S,S],bets:[0,0],pot:0,btn:cfg.btn,fold:-1,log:[],done:0};if(ui.r){TG=G;window.TG=G}
const{hole,stk,bets}=G,nm=['You','Bot'];let ai=0,ag=0,bl=0;const post=(p,a)=>{stk[p]-=a;bets[p]+=a;if(!stk[p])ai|=1<<p},tp=()=>G.pot+bets[0]+bets[1],L=t=>{G.log.push(t);ui.r&&ui.r()};
post(cfg.btn,.5);post(1-cfg.btn,1);
const rnd=async first=>{let cur=first,acted=0,rs=0,inc=1;for(;;){const o=1-cur,tc=bets[o]-bets[cur];if(!stk[cur]||(!stk[o]&&tc<=0))return;
const cap=bets[cur]+stk[cur],lo=Math.min(cap,bets[o]+inc),T=tp(),hi=V.pl?Math.min(cap,bets[o]+T+tc):cap,canR=rs<3&&stk[cur]>tc,inf={cur,tc,T,lo,hi,canR,ob:bets[o]};
const a=P[cur]=='h'?await ui.ask(inf):bot(P[cur],{...inf,V,h:hole[cur],b:G.board},rng);
if(a.t=='r'&&canR){const to=Math.max(lo,Math.min(hi,Math.round(a.to*2)/2));if(to>bets[o]){post(cur,to-bets[cur]);inc=to-bets[o];rs++;acted=1;if(cur==0){ag++;if(a.bl)bl=1}L(`${nm[cur]} ${tc?'raises to':'bets'} ${to}${stk[cur]?'':' (all-in)'}`);cur=o;continue}}

const pay=Math.min(tc,stk[cur]);post(cur,pay);L(nm[cur]+(tc?' calls '+pay:' checks'));if(acted)return;acted=1;cur=o}};
for(let s=0;s<4&&G.fold<0;s++){if(s==1){G.board.push(...deck.splice(0,3));if(V.disc)for(const p of[0,1]){const i=P[p]=='h'?await ui.disc():[0,1,2].map(i=>best(V,hole[p].filter((_,j)=>j!=i),G.board)).reduce((m,x,i,a)=>x>a[m]?i:m,0);hole[p].splice(i,1)}}else if(s>1)G.board.push(deck.shift());

let w;if(G.fold>=0)w=1-G.fold;else{while(G.board.length<5)G.board.push(deck.shift());const x=best(V,hole[0],G.board),y=best(V,hole[1],G.board);w=x>y?0:y>x?1:-1}
const pot=G.pot;if(w<0){stk[0]+=pot/2;stk[1]+=pot/2}else stk[w]+=pot;if(stk[0]+stk[1]!=2*S)throw Error('chip conservation violated');G.done=1;
L(G.fold>=0?`${nm[w]} wins ${pot} (no showdown)`:w<0?`Split pot ${pot}`:`Showdown: ${nm[w]} wins ${pot}`);return{p:stk[0]-S,pot,fold:G.fold,sd:G.fold<0?1:0,ai:ai&1,ag,bl,blw:bl&&G.fold==1?1:0}}
// ---------- Table UI ----------
let TG,pend,pdisc,INF,busy=0,seed=Date.now()%1e6,bank=1000,hs=0,btnT=0,CANCEL=0,D=null;const HIST={};
const card=(c,h)=>`<span class="pc ${h?'b':[1,2].includes(c&3)?'r':''}">${h?'':RK[c>>2]+'<br>'+SU[c&3]}</span>`;
function drawT(i){const G=TG,sh=G.done&&G.fold<0;let h=`<div class="felt"><div>${G.hole[1].map(c=>card(c,!sh)).join('')}<br>Bot · ${G.stk[1]} BB${G.btn==1?' · dealer':''}</div><h3>Pot ${G.pot+G.bets[0]+G.bets[1]}</h3><div>${G.board.map(c=>card(c)).join('')||'&nbsp;'}</div><div>${G.hole[0].map((c,k)=>`<span ${G.disc?`onclick="pickD(${k})" title="Discard" style="cursor:pointer"`:''}>${card(c)}</span>`).join('')}<br>You · ${G.stk[0]} BB${G.btn==0?' · dealer':''}</div></div>`;
if(G.disc)h+='<p>Crazy Pineapple: click a hole card to discard it.</p>';
if(i&&pend)h+=`<div class="card row"><button class="s" onclick="act('f')">Fold</button><button onclick="act('c')">${i.tc?'Call '+Math.min(i.tc,G.stk[0]):'Check'}</button>${i.canR?`<input type="range" id="rs" min="${i.lo}" max="${i.hi}" step=".5" value="${i.lo}" oninput="rv.textContent=this.value" aria-label="Bet size"><b id="rv">${i.lo}</b><button onclick="act('r')">${i.tc?'Raise':'Bet'}</button><button class="s" onclick="setS(.5)">½ pot</button><button class="s" onclick="setS(1)">Pot</button><button class="s" onclick="setS(99)">All-in</button>`:''}</div>`;
$('#tb').innerHTML=h;$('#tl').innerHTML='<b>Hand history</b><br>'+G.log.slice(-10).join('<br>')}
const act=t=>{const p=pend;pend=null;p({t,to:t=='r'?+$('#rs').value:0})},pickD=i=>{TG.disc=0;pdisc(i)};
function setS(f){const i=INF,v=Math.max(i.lo,Math.min(i.hi,Math.round((i.ob+f*(i.T+i.tc))*2)/2));$('#rs').value=v;$('#rv').textContent=v}
async function nextHand(){if(busy)return;busy=1;const r=await hand({v:$('#tv').value,btn:btnT^=1},rngf(seed++),['h',POL[$('#to').value]],{r:()=>drawT(),ask:i=>{INF=i;drawT(i);return new Promise(r=>pend=r)},disc:()=>new Promise(r=>{TG.disc=1;pdisc=r;drawT()})});busy=0;bank+=r.p;hs++;$('#bk').textContent=`Bankroll ${bank} BB (simulated) · ${hs} hands`;drawT()}
// ---------- Simulation ----------
async function runSim(cfg,onp){const rng=rngf(cfg.seed),P=[cfg.p0,cfg.p1],out=[];for(let i=0;i<cfg.n&&!CANCEL;i++){out.push(await hand({v:cfg.v,btn:i%2},rng,P,{}));if(i%5==4){onp&&onp(i+1);await new Promise(r=>setTimeout(r))}}return out}
function mk(rs){const p=rs.map(r=>r.p),cum=[];let c=0;p.forEach(x=>cum.push(c+=x));const w=20,at=f=>p.map((_,i)=>i<w-1?null:f(p.slice(i-w+1,i+1)));return{profit:p,bankroll:cum.map(x=>1000+x),cum,rollwin:at(a=>mean(a.map(x=>+(x>0)))),rollvol:at(sd)}}
function stats(rs){const p=rs.map(r=>r.p);let pk=0,dd=0,c=0,ws=0,ls=0,cw=0,cl=0,pkd=null,cb=0;p.forEach(x=>{c+=x;pk=Math.max(pk,c);dd=Math.max(dd,pk-c);cw=x>0?cw+1:0;cl=x<0?cl+1:0;ws=Math.max(ws,cw);ls=Math.max(ls,cl);if(pkd===null&&pk-c>=40)pkd=pk;else if(pkd!==null&&c>=pkd)cb=1});const q=rs.filter(r=>r.sd);

// ---------- Charts ----------
const TIPS={};function plot(id,ss,o={}){const W=640,H=o.h||200,P=30,all=ss.flatMap(s=>s.y.filter(v=>v!=null&&isFinite(v)));if(!all.length)return $(id).innerHTML='<p class="m">No data.</p>';
const lo=Math.min(...all),hi=Math.max(...all),n=Math.max(...ss.map(s=>s.y.length)),x=i=>P+i/Math.max(1,n-1)*(W-P-6),y=v=>H-16-(v-lo)/(hi-lo||1)*(H-26);TIPS[id]={ss,n,W,P};
let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${o.t||'chart'}" onmousemove="tip('${id}',event)"><text x="2" y="10">${+hi.toFixed(2)}</text><text x="2" y="${H-16}">${+lo.toFixed(2)}</text>${lo<=0&&hi>=0?`<line x1="${P}" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="#777" stroke-dasharray="3"/>`:''}`;
ss.forEach((s,k)=>{if(o.bars&&!k)g+=s.y.map((v,i)=>`<line x1="${x(i)}" x2="${x(i)}" y1="${y(0)}" y2="${y(v)}" stroke="${s.c}" stroke-width="3"/>`).join('');else{let d='',up=0;s.y.forEach((v,i)=>{if(v==null||!isFinite(v)){up=0;return}d+=(up?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1);up=1});g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="1.4"/>`}g+=`<text x="${P+8+k*110}" y="10" style="fill:${s.c}">${s.n}</text>`});
$(id).innerHTML=g+`</svg><div class="m" id="${id.slice(1)}t">hover to inspect</div>`}
function tip(id,e){const t=TIPS[id],r=e.currentTarget.getBoundingClientRect(),i=Math.round(((e.clientX-r.left)/r.width*t.W-t.P)/(t.W-t.P-6)*(t.n-1));$(id+'t').textContent=`#${i+1}  `+t.ss.map(s=>s.n+': '+(s.y[i]==null?'–':+s.y[i].toFixed(3))).join('  ')}
function scat(id,pts){const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),a=Math.min(...xs),b=Math.max(...xs),c=Math.min(...ys),d=Math.max(...ys);$(id).innerHTML=`<svg viewBox="0 0 300 220" width="100%" role="img" aria-label="Lag plot">${pts.map(p=>`<circle cx="${20+(p[0]-a)/(b-a||1)*270}" cy="${205-(p[1]-c)/(d-c||1)*195}" r="2" fill="${C[0]}" opacity=".6"><title>${p[0].toFixed(2)}, ${p[1].toFixed(2)}</title></circle>`).join('')}<text x="2" y="218">x(t−k) ${+a.toFixed(1)}…${+b.toFixed(1)}</text><text x="2" y="10">x(t) ${+c.toFixed(1)}…${+d.toFixed(1)}</text></svg>`}
// ---------- ATSA methods ----------
const diff=x=>x.slice(1).map((v,i)=>v-x[i]),sma=(x,w)=>x.map((_,i)=>i<w-1?null:mean(x.slice(i-w+1,i+1)));

const bestSES=x=>{let b;for(let a=.05;a<=1.001;a+=.05){const r=ses(x,a);if(!b||r.sse<b.sse)b={...r,a}}return b};
function holt(x,a,b){let l=x[0],tr=x[1]-x[0];const f=[x[0]];let sse=0;for(let t=1;t<x.length;t++){const p=l+tr;f.push(p);sse+=(x[t]-p)**2;const nl=a*x[t]+(1-a)*p;tr=b*(nl-l)+(1-b)*tr;l=nl}return{f,l,tr,sse}}
const bestHolt=x=>{let r;for(let a=.1;a<1;a+=.1)for(let b=.05;b<1;b+=.15){const q=holt(x,a,b);if(!r||q.sse<r.sse)r={...q,a,b}}return r};
function acf(x,K){const m=mean(x),d=x.map(v=>v-m),c0=sum(d.map(v=>v*v)),r=[1];for(let k=1;k<=K;k++){let s=0;for(let i=k;i<x.length;i++)s+=d[i]*d[i-k];r.push(c0?s/c0:0)}return r}
function pacf(r,K){const p=[1];let phi=[];for(let k=1;k<=K;k++){let nu=r[k],de=1;for(let j=1;j<k;j++){nu-=phi[j-1]*r[k-j];de-=phi[j-1]*r[j]}const a=de?nu/de:0;phi=[...phi.map((v,j)=>v-a*phi[k-2-j]),a];p.push(a)}return p}
function ols(X,y){const k=X[0].length,R=[...Array(k).keys()],A=R.map(i=>R.map(j=>sum(X.map(r=>r[i]*r[j])))),B=R.map(i=>sum(X.map((r,t)=>r[i]*y[t]))),M=A.map((r,i)=>[...r,...R.map(j=>+(i==j))]);
for(let i=0;i<k;i++){let p=i;for(let r=i+1;r<k;r++)if(Math.abs(M[r][i])>Math.abs(M[p][i]))p=r;[M[i],M[p]]=[M[p],M[i]];const d=M[i][i]||1e-12;M[i]=M[i].map(v=>v/d);for(let r=0;r<k;r++)if(r!=i){const f=M[r][i];M[r]=M[r].map((v,j)=>v-f*M[i][j])}}
const Ai=M.map(r=>r.slice(k)),b=Ai.map(r=>sum(r.map((v,j)=>v*B[j]))),res=y.map((v,t)=>v-sum(X[t].map((q,j)=>q*b[j]))),rss=sum(res.map(v=>v*v)),s2=rss/Math.max(1,y.length-k);return{b,res,rss,se:Ai.map((r,i)=>Math.sqrt(Math.max(0,r[i]*s2))),r2:1-rss/sum(y.map(v=>(v-mean(y))**2))}}

const SERN={profit:'Profit per hand (BB)',bankroll:'Bankroll (BB)',cum:'Cumulative P/L (BB)',rollwin:'Rolling win rate (20)',rollvol:'Rolling volatility (20)'};
const opt=(o,v)=>Object.entries(o).map(([k,t])=>`<option value="${k}" ${k==v?'selected':''}>${t}</option>`).join(''),need=id=>D?0:($(id).innerHTML='<div class="card">No data yet. Run a simulation in the Lab first.</div>',1);
function atsa(){if(need('#as'))return;const k=$('#ak').value,w=+$('#aw').value,K0=+$('#al').value,lg=+$('#ag').value;let x=D.s[k].filter(v=>v!=null);if($('#at').value=='d')x=diff(x);
if(x.length<20||sd(x)==0)return $('#as').innerHTML='<div class="card">Series is too short (&lt;20) or constant; choose another series or run more hands.</div>';
const K=Math.min(K0,Math.floor(x.length/2)-1),r=acf(x,K),pc=pacf(r,K),b=1.96/Math.sqrt(x.length),out=r.slice(1).filter(v=>Math.abs(v)>b).length,fl=a=>a.map(()=>b),s=bestSES(x),h=bestHolt(x),a1=adf(x),a2=adf(diff(x)),tr=ols(x.map((_,t)=>[1,t]),x),v=a=>a.t<-2.86?'rejects the unit-root null at 5% (consistent with stationarity)':'fails to reject the unit-root null at 5% (non-stationary not ruled out)';
$('#as').innerHTML=`<div class="card"><h3>Moving average, SES and Holt</h3><div id="a1"></div><p class="m">SMA(${w}) lags the series by about ${(w-1)/2} steps and smooths noise; first ${w-1} points are left empty (incomplete window). SES α=${s.a.toFixed(2)} (level only, suits series without trend); Holt α=${h.a.toFixed(1)}, β=${h.b.toFixed(2)} (level+trend; trend=${h.tr.toFixed(3)}). Parameters minimise one-step SSE.</p></div>
<div class="g2"><div class="card"><h3>ACF</h3><div id="a2"></div></div><div class="card"><h3>PACF</h3><div id="a3"></div></div></div><p class="m">${out} of ${K} ACF lags lie outside ±1.96/√n; about ${(K*.05).toFixed(1)} are expected by chance for independent data. A significant lag is not by itself useful predictive power.</p>
<div class="g2"><div class="card"><h3>Lag plot (k=${lg})</h3><div id="a4"></div></div><div class="card"><h3>Stationarity (ADF, constant, ${a1.p} lags)</h3><p>Original: t=${a1.t.toFixed(2)} → ${v(a1)}.<br>First difference: t=${a2.t.toFixed(2)} → ${v(a2)}.</p><p class="m">H0: unit root (non-stationary). Critical values (asymptotic, constant): 1% −3.43, 5% −2.86, 10% −2.57. Tests never prove stationarity; lag order is fixed, not AIC-selected. KPSS is not implemented.</p></div></div>
<div class="card"><h3>Linear trend regression</h3><div id="a5"></div><p>Intercept ${tr.b[0].toFixed(3)}, slope ${tr.b[1].toFixed(4)} ± ${tr.se[1].toFixed(4)} per hand, R² ${tr.r2.toFixed(3)}. This describes association over the sample; extrapolating it or reading it as causal is unsafe.</p></div>`;
plot('#a1',[{n:'raw',y:x,c:'#777'},{n:'SMA',y:sma(x,w),c:C[1]},{n:'SES',y:s.f,c:C[2]},{n:'Holt',y:h.f,c:C[3]}],{t:'smoothing'});
plot('#a2',[{n:'ACF (lag 1…)',y:r.slice(1),c:C[0]},{n:'+95%',y:fl(r.slice(1)),c:C[1]},{n:'−95%',y:fl(r.slice(1)).map(v=>-v),c:C[1]}],{bars:1,h:160});plot('#a3',[{n:'PACF',y:pc.slice(1),c:C[3]},{n:'+95%',y:fl(pc.slice(1)),c:C[1]},{n:'−95%',y:fl(pc.slice(1)).map(v=>-v),c:C[1]}],{bars:1,h:160});
scat('#a4',x.slice(lg).map((q,i)=>[x[i],q]));plot('#a5',[{n:'actual',y:x,c:'#777'},{n:'fitted',y:x.map((_,t)=>tr.b[0]+tr.b[1]*t),c:C[1]}])}
// ---------- Forecast Arena ----------
function models(tr,h,o){const m={},F=v=>Array(h).fill(v),s=bestSES(tr),ho=bestHolt(tr),n=tr.length,r=ols(tr.map((_,t)=>[1,t]),tr),ar=arF(tr,o.p,o.d,h);
m.Naive={p:F(tr.at(-1)),q:'last value'};m['Moving avg']={p:F(mean(tr.slice(-o.w))),q:'w='+o.w};m.SES={p:F(s.l),q:'α='+s.a.toFixed(2)};m.Holt={p:[...Array(h)].map((_,i)=>ho.l+(i+1)*ho.tr),q:`α=${ho.a.toFixed(1)} β=${ho.b.toFixed(2)}`};
m['Linear trend']={p:[...Array(h)].map((_,i)=>r.b[0]+r.b[1]*(n+i)),q:'slope='+r.b[1].toFixed(3)};if(ar)m[`ARIMA(${o.p},${o.d},0)`]={p:ar,q:'OLS AR, no MA term'};return m}
function fc(){if(need('#fo'))return;const y=D.s[$('#fk').value].filter(v=>v!=null),cut=Math.floor(y.length*+$('#ft').value/100),tr=y.slice(0,cut),te=y.slice(cut);if(tr.length<30||te.length<5)return $('#fo').innerHTML='<div class="card">Need ≥30 training and ≥5 test points; run more hands.</div>';
const M=models(tr,te.length,{w:+$('#fw').value,p:+$('#fp').value,d:+$('#fd').value}),mt=$('#fm').value,pos=te.every(v=>v>0),R=Object.entries(M).map(([n,o])=>{const e=te.map((v,i)=>v-o.p[i]);return{n,q:o.q,p:o.p,mae:mean(e.map(Math.abs)),rmse:Math.sqrt(mean(e.map(v=>v*v))),bias:mean(e),ac:acf(e,1)[1],mape:pos?mean(e.map((v,i)=>Math.abs(v/te[i])))*100:null}}),bn=R.reduce((a,b)=>b[mt]<a[mt]?b:a).n;
$('#fo').innerHTML=`<div class="card"><div id="fch"></div><table><tr><th>Model</th><th>Parameters</th><th>MAE</th><th>RMSE</th><th>MAPE</th><th>Bias</th><th>Resid ρ1</th></tr>${R.map(r=>`<tr ${r.n==bn?'style="font-weight:700;color:var(--ac)"':''}><td>${r.n}${r.n==bn?' ★':''}</td><td>${r.q}</td><td>${r.mae.toFixed(3)}</td><td>${r.rmse.toFixed(3)}</td><td>${r.mape==null?'n/a':r.mape.toFixed(1)+'%'}</td><td>${r.bias.toFixed(3)}</td><td>${r.ac.toFixed(2)}</td></tr>`).join('')}</table>
<p class="m">Train ${tr.length} / test ${te.length} (chronological; all parameters fitted on train only; every model scored on the same held-out points). ★ = lowest ${mt.toUpperCase()}. MAPE shown only when all test values &gt; 0. The best model will differ by series, variant and settings; for i.i.d. per-hand profit, expect no model to beat the naive/mean baselines meaningfully. Forecast intervals not implemented.</p></div>`;
plot('#fch',[{n:'actual',y,c:'#999'},...R.map((r,i)=>({n:r.n,y:Array(cut).fill(null).concat(r.p),c:C[i%5]}))].slice(0,6),{h:230,t:'forecast comparison'})}
// ---------- Experiments ----------
async function runExp(){CANCEL=0;const kd=$('#ek').value,T=+$('#et').value,H=+$('#eh').value,v=$('#ev').value,cf=kd=='E'?Object.values(POL).map(p=>({l:p.n,v,p})):['holdem','omaha','pine'].map(q=>({l:VARN[q],v:q,p:POL.vidit})),rows=[];
if(!(T>=1&&T<=10&&H>=20&&H<=500))return toast('Trials 1–10, hands 20–500');$('#eb').disabled=1;
for(const c of cf){const ms=[],ss=[],ds=[],bs=[];for(let t=0;t<T;t++){$('#ep').textContent=`Running ${c.l}, trial ${t+1}/${T}…`;const q=stats(await runSim({n:H,v:c.v,seed:1000+t,p0:c.p,p1:POL.bal}));ms.push(q.mean);ss.push(q.sd);ds.push(q.dd);bs.push(q.best)}rows.push({l:c.l,m:mean(ms),se:T>1?sd(ms)/Math.sqrt(T):NaN,sd:mean(ss),dd:mean(ds),b:Math.max(...bs)})}
$('#eb').disabled=0;$('#ep').textContent='Done.';const top=rows.reduce((a,b)=>b.m>a.m?b:a),ov=rows.filter(r=>r!=top&&top.m-1.96*top.se<=r.m+1.96*r.se).length,V=POL.vidit;
$('#eo').innerHTML=`<div class="card"><table><tr><th>${kd=='E'?'Policy':'Variant'}</th><th>Mean BB/hand ±95% CI</th><th>SD/hand</th><th>Avg max drawdown</th><th>Biggest win</th></tr>${rows.map(r=>`<tr><td>${r.l}</td><td>${r.m.toFixed(2)} ± ${isNaN(r.se)?'–':(1.96*r.se).toFixed(2)}</td><td>${r.sd.toFixed(1)}</td><td>${r.dd.toFixed(0)}</td><td>${r.b.toFixed(0)}</td></tr>`).join('')}</table>
<p><b>Observation:</b> highest mean: ${top.l} (${top.m.toFixed(2)} BB/hand). ${ov?`${ov} other row(s) have overlapping intervals, so the ranking is not statistically separated.`:'Intervals are separated from the top row.'} Compare SD and drawdown, not just the mean: a rare big pot is not evidence of profitability.</p>
<p class="m"><b>Record.</b> Hypothesis: ${($('#eh2').value||'(none)').replace(/</g,'&lt;')}<br>Variant: ${kd=='E'?VARN[v]:'Hold’em, PLO, Pineapple'}; ${T} trials × ${H} hands; seeds 1000–${999+T} (same seeds across rows); opponent Balanced; Vidit params agg ${V.agg}, bluff ${V.bluff}, risk ${V.risk}; metric: profit per hand in BB.<br><b>Limits:</b> small samples, heads-up only, one opponent type, heuristic Monte-Carlo equity. Settings changes are controlled; differences in outcomes are only observed, not proven causal.</p></div>`}
// ---------- Profile / personalization ----------
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};let NAME=LS.get('nm')||'Vidit',PERS=LS.get('pe')!='0',EN=LS.get('en')=='1';
const AC=[['High Roller','Won a pot of 60+ BB in one hand',s=>s.best>=60],['Bluff Master','5+ bluff wins at ≥50% (bluff = bet/raise with equity <40%; win = opponent folded)',s=>s.blw>=5&&s.blw/Math.max(1,s.bl)>=.5],['Risk Taker','Per-hand SD ≥ 20 BB',s=>s.sd>=20],['Comeback King','Recovered a 40+ BB drawdown to a new peak',s=>s.cb],['All-In or Nothing','All-in in 10+ hands',s=>s.ai>=10]];
function applyP(){document.body.classList.toggle('en',PERS&&EN);$('#wl').textContent=PERS?`Welcome back, ${NAME}. Variance is just rent.`:''}
function prof(){const s=D&&D.st,nm=PERS?NAME:'Player',hv=Object.entries(HIST);$('#pf').innerHTML=`<div class="card"><h2>${nm.replace(/</g,'')} · ${POL.vidit.n}</h2><p>“Vidit doesn’t mind variance. He can lose a monster pot, bluff an opponent out of a hand, or turn one good run into a massive session. High risk, high volatility, and absolutely no guarantee of winning.”</p>
<p class="m">Policy: aggression ${POL.vidit.agg}, bluff frequency ${POL.vidit.bluff}, risk appetite ${POL.vidit.risk} (editable in the Lab). It sees only its own cards, the board, pot and legal bounds, and folds when equity is poor. All chips are virtual.</p></div>
<div class="card"><h3>Settings (stored only in this browser)</h3><div class="row" onchange="setP()">Display name <input id="pn" value="${NAME.replace(/"/g,'')}" maxlength="20"> <label><input type="checkbox" id="pp" ${PERS?'checked':''}> Personal visuals</label> <label><input type="checkbox" id="pe" ${EN?'checked':''}> Energy Mode (red accent)</label></div></div>
${s?`<div class="card"><h3>Latest run: ${D.cfg.p0.n} · ${VARN[D.cfg.v]} · ${s.n} hands</h3><table><tr><td>Net P/L (realized)</td><td>${s.net.toFixed(1)} BB</td></tr><tr><td>Biggest win / loss (one hand)</td><td>${s.best.toFixed(1)} / ${s.worst.toFixed(1)} BB</td></tr><tr><td>Longest win / loss streak</td><td>${s.ws} / ${s.ls}</td></tr><tr><td>Bets+raises per hand</td><td>${s.ag.toFixed(2)}</td></tr><tr><td>Bluff attempts / folds induced</td><td>${s.bl} / ${s.blw}</td></tr><tr><td>Showdown win rate</td><td>${(s.sdw*100).toFixed(0)}%</td></tr><tr><td>Per-hand volatility (SD)</td><td>${s.sd.toFixed(1)} BB</td></tr></table>
${PERS?`<p class="m">Energy meter (session volatility)</p><div class="bar" title="SD ${s.sd.toFixed(1)} BB"><i style="width:${Math.min(100,s.sd*3)}%"></i></div>`:''}<div>${AC.map(a=>`<span class="ach ${a[2](s)?'u':''}" title="${a[1]}">${a[0]}</span>`).join('')}</div></div>`:'<div class="card">Run a simulation to see statistics and achievements.</div>'}
${hv.length?`<div class="card"><h3>Performance by variant (this session)</h3><table>${hv.map(([k,q])=>`<tr><td>${VARN[k]}</td><td>${q.n} hands</td><td>${q.net.toFixed(1)} BB</td></tr>`).join('')}</table></div>`:''}`}
function setP(){NAME=$('#pn').value||'Vidit';PERS=$('#pp').checked;EN=$('#pe').checked;LS.set('nm',NAME);LS.set('pe',PERS?1:0);LS.set('en',EN?1:0);applyP()}
const toast=t=>{const e=$('#ts');e.textContent=t;e.hidden=0;setTimeout(()=>e.hidden=1,3500)};let eg=0;$('#lg').onclick=()=>{if(PERS&&++eg==5){eg=0;toast('Energy unlocked: this app gives you wings. (A nod only; not affiliated with any drink brand.)')}};
// ---------- Lab ----------
function lab(){if(!D)return;const s=D.st,c=(l,v)=>`<div class="card"><div class="m">${l}</div><b style="font:600 18px Georgia">${v}</b></div>`;
$('#sum').innerHTML=`<div class="g">${c('Hands',s.n)+c('Net (BB)',s.net.toFixed(1))+c('Mean / hand',s.mean.toFixed(2))+c('SD / hand',s.sd.toFixed(1))+c('Max drawdown',s.dd.toFixed(0))+c('Biggest win',s.best.toFixed(1))+c('Biggest loss',s.worst.toFixed(1))+c('Showdown win',(s.sdw*100).toFixed(0)+'%')+c('Aggression',s.ag.toFixed(2))}</div>`;
const w=+$('#lw').value||20,k=$('#lk').value;plot('#ch1',[{n:SERN[k],y:D.s[k],c:C[0]},{n:`SMA(${w})`,y:sma(D.s[k].map(v=>v??0),w),c:C[1]}],{h:230,t:SERN[k]})}
function csv(){if(!D)return toast('Nothing to copy yet');const t='hand,profit_bb,bankroll_bb,pot_bb\n'+D.rs.map((r,i)=>[i+1,r.p,D.s.bankroll[i],r.pot].join(',')).join('\n');navigator.clipboard.writeText(t).then(()=>toast('CSV copied'),()=>toast('Clipboard blocked by browser'))}
async function go_(){CANCEL=0;const cfg={n:+$('#ln').value,v:$('#lv').value,seed:+$('#lsd').value,p0:POL[$('#lp').value],p1:POL[$('#lo').value]};if(!(cfg.n>=10&&cfg.n<=5000))return toast('Hands must be 10–5000');const t0=Date.now();$('#go').disabled=1;
const rs=await runSim(cfg,i=>$('#pg').textContent=`${i}/${cfg.n} hands · ${((Date.now()-t0)/1e3).toFixed(1)}s`);$('#go').disabled=0;if(!rs.length)return;D={rs,s:mk(rs),cfg,st:stats(rs)};const q=HIST[cfg.v]??={n:0,net:0};q.n+=rs.length;q.net+=D.st.net;$('#pg').textContent+=CANCEL?' · cancelled (partial data)':' · complete';lab()}
const vit=(k,v)=>{POL.vidit[k]=+v;$('#vv_'+k).textContent=v};
const sl=(k,l)=>`<label>${l} <input type="range" min="0" max="1" step=".05" value="${POL.vidit[k]}" oninput="vit('${k}',this.value)"><b id="vv_${k}">${POL.vidit[k]}</b></label>`;
const TABS=[['table','Table'],['lab','Lab'],['atsa','ATSA'],['fc','Forecast'],['exp','Experiments'],['prof','Profile']];
$('#app').innerHTML=`<section id="s_table"><div class="row"><select id="tv" aria-label="Variant">${opt(VARN)}</select><select id="to" aria-label="Opponent">${opt(PN,'bal')}</select><button onclick="nextHand()">Deal</button><span id="bk" class="m">Bankroll 1000 BB (simulated)</span></div><div id="tb"><div class="card">Heads-up against a computer opponent. Stacks reset to 100 BB each hand; blinds 0.5/1; max 3 raises per street; Omaha is pot-limit. Press Deal.</div></div><div class="card" id="tl"></div></section>
<section id="s_lab" hidden><div class="card"><h2>Simulation Lab &amp; dashboard</h2><div class="row"><select id="lv" aria-label="Variant">${opt(VARN)}</select>Hands <input type="number" id="ln" value="300">Seed <input type="number" id="lsd" value="42">Subject <select id="lp">${opt(PN,'vidit')}</select>vs <select id="lo">${opt(PN,'bal')}</select></div><div class="row">${sl('agg','Aggression')}${sl('bluff','Bluff')}${sl('risk','Risk')}</div><div class="row"><button id="go" onclick="go_()">Run simulation</button><button class="s" onclick="CANCEL=1">Cancel</button><span id="pg" class="m">Same seed + settings reproduce the same data. Units: BB; bankroll starts at 1000 (virtual).</span></div></div><div id="sum"><div class="card">No runs yet. Start your first simulation above.</div></div>
<div class="card"><div class="row"><select id="lk" onchange="lab()">${opt(SERN)}</select>SMA window <input type="number" id="lw" value="20" onchange="lab()"><button class="s" onclick="csv()">Copy CSV</button></div><div id="ch1"></div></div></section>
<section id="s_atsa" hidden><div class="card row" onchange="atsa()"><select id="ak">${opt(SERN)}</select><select id="at"><option value="n">Original</option><option value="d">First difference</option></select>SMA window <input type="number" id="aw" value="20">Max lag <input type="number" id="al" value="20">Lag plot k <input type="number" id="ag" value="1" min="1"></div><div id="as"></div></section>
<section id="s_fc" hidden><div class="card row" onchange="fc()"><select id="fk">${opt(SERN,'bankroll')}</select>Train % <input type="number" id="ft" value="80" min="50" max="95">MA w <input type="number" id="fw" value="10">AR p <input type="number" id="fp" value="2" min="0" max="8">d <input type="number" id="fd" value="1" min="0" max="2"><select id="fm"><option value="rmse">Best by RMSE</option><option value="mae">Best by MAE</option></select></div><div id="fo"></div></section>
<section id="s_exp" hidden><div class="card"><h2>Experiment Lab</h2><div class="row"><select id="ek"><option value="E">E: Vidit vs other policies (vs Balanced)</option><option value="F">F: Vidit across variants</option></select><select id="ev">${opt(VARN)}</select>Trials <input type="number" id="et" value="3">Hands/trial <input type="number" id="eh" value="60"></div><textarea id="eh2" rows="2" style="width:100%" placeholder="Hypothesis, e.g. Vidit Mode has higher variance but not a higher mean than Balanced"></textarea><div class="row"><button id="eb" onclick="runExp()">Run experiment</button><span id="ep" class="m">Larger samples give tighter intervals but take longer.</span></div></div><div id="eo"></div></section>
<section id="s_prof" hidden><div id="pf"></div></section><p class="m">Educational simulation with virtual chips only: no real money, no profit guarantees. Runs live in memory; reload clears them.</p>`;
$('#nv').innerHTML=TABS.map(([k,t])=>`<button class="s" id="n_${k}" onclick="show('${k}')">${t}</button>`).join('');
function show(k){TABS.forEach(([q])=>{$('#s_'+q).hidden=q!=k;$('#n_'+q).classList.toggle('on',q==k)});({atsa,fc,prof,lab})[k]?.()}
show('table');applyP();
</script></body></html>
